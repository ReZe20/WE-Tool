name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动触发的版本号（如 v0.2.0），留空则用分支名'
        required: false
        default: ''
      notes:
        description: '版本介绍（可选）：填写则作为 Release 说明；留空则从 CHANGELOG.md 提取对应版本段落'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # RePKG_Re 是独立仓库（被 .gitignore 排除），构建时需要自行拉取
      - name: 获取 RePKG_Re（构建依赖）
        run: git clone --depth 1 https://github.com/ReZe20/repkg-Re.git external/repkg_Re

      - name: 发布 SelfContained AOT (x64)
        run: dotnet publish "WE Tool/WE Tool.csproj" -c Release -p:Platform=x64 -p:PublishProfile=SelfContained_win-amd64

      - name: 生成版本介绍
        shell: pwsh
        run: |
          $ver = if ("${{ inputs.version }}") { "${{ inputs.version }}" } elseif ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "dev" }
          # csproj 的 PackageZip 目标已自动打包到 bin/Package/,这里复制为带 tag 版本号的名字供 Release 上传
          $zip = Get-ChildItem "WE Tool/bin/Package/WE-Tool-*-portable.zip" | Select-Object -First 1
          Copy-Item $zip.FullName "WE-Tool-$ver-portable.zip" -Force
          echo "version=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

          # 版本介绍：手动输入的 notes 优先，其次 CHANGELOG.md 中当前版本的段落
          $body = ""
          if ("${{ inputs.notes }}") { $body = "${{ inputs.notes }}" }
          elseif (Test-Path "CHANGELOG.md") {
            $lines = Get-Content "CHANGELOG.md"
            $inSection = $false
            $section = @()
            foreach ($line in $lines) {
              if ($line -match "^## $ver($|\s)") { $inSection = $true; continue }
              if ($inSection -and $line -match "^## ") { break }
              if ($inSection) { $section += $line }
            }
            if ($section.Count -gt 0) { $body = ($section -join "`n").Trim() }
          }
          if ($body) {
            Set-Content -Path "release-body.md" -Value $body -Encoding UTF8
            echo "HAS_BODY=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "HAS_BODY=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      # 安装包模式:用 Inno Setup 把 PackageZip 已生成的未压缩文件夹打成单个 setup.exe
      # (runner 镜像自带 Inno Setup 6;产物复制为带 tag 版本号的名字供 Release 上传)
      - name: 编译安装包（Inno Setup）
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                    "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                    "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "runner 上未找到 ISCC.exe（Inno Setup 6）" }
          $src = Get-ChildItem "WE Tool/bin/Package/WE-Tool-*-portable" -Directory | Select-Object -First 1
          if (-not $src) { throw "未找到发布文件夹" }
          # 内部版本号用纯数字(0.7.1);Release 资产名沿用 tag 风格(v0.7.1)
          $verNum = ($env:version -replace '^v', '')
          & $iscc /Qp "/DAppVersion=$verNum" "/DSourceRoot=$($src.FullName)" "/O$(Resolve-Path 'installer')\bin" "installer/we-tool.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          $setup = Get-ChildItem "installer/bin/WE-Tool-*-win-x64-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "WE-Tool-$($env:version)-win-x64-setup.exe" -Force

      - name: 创建 Release（自定义版本介绍）
        if: env.HAS_BODY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          body_path: release-body.md
          files: |
            WE-Tool-${{ env.version }}-portable.zip
            WE-Tool-${{ env.version }}-win-x64-setup.exe

      - name: 创建 Release（自动生成介绍）
        if: env.HAS_BODY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          files: |
            WE-Tool-${{ env.version }}-portable.zip
            WE-Tool-${{ env.version }}-win-x64-setup.exe
          generate_release_notes: true
